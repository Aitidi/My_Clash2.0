name: Validate configuration

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      check_sources:
        description: Check live external rules (requires network)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e .
      - run: python -m my_clash validate
      - run: python -m unittest discover -s tests -v
      - run: python -m my_clash build --check
      - run: python -m my_clash build --output dist/package
      - uses: actions/upload-artifact@v4
        with:
          name: configuration-${{ matrix.os }}-${{ matrix.python }}
          path: dist/package/
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.check_sources && matrix.os == 'ubuntu-latest' && matrix.python == '3.14' }}
        run: python -m my_clash check-sources
