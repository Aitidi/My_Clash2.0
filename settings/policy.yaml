  - DIRECT
- name: 🇭🇰 香港节点
  type: url-test
  filter: (香港|Hong Kong)
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
- name: 🇯🇵 日本节点
  type: url-test
  filter: (日本|川日|东京|大阪|泉日|埼玉|沪日|深日|[^-]日|JP|Japan)
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
- name: 🇺🇲 美国节点
  type: url-test
  filter: (美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States)
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 150
- name: 🇨🇳 台湾节点
  type: url-test
  filter: (台|新北|彰化|TW|Taiwan)
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
- name: 🇸🇬 狮城节点
  type: url-test
  filter: (新加坡|坡|狮城|SG|Singapore)
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
- name: 🇰🇷 韩国节点
  type: url-test
  filter: (KR|Korea|KOR|首尔|韩|韓)
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
- name: 🇫🇷 法国节点
  type: url-test
  filter: (🇫🇷|法|FR|France)
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
- name: 🇬🇧 英国节点
  type: url-test
  filter: (🇬🇧|英)
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
- name: 🌐 其他地区节点
  type: url-test
  filter: ^(?!.*(香港|Hong Kong|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|[^-]日|JP|Japan|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States|台|新北|彰化|TW|Taiwan|新加坡|坡|狮城|SG|Singapore|KR|Korea|KOR|首尔|韩|韓|🇫🇷|法|FR|France|🇬🇧|英)).*
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
