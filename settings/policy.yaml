  - 手动选择
  - 🇭🇰 香港节点
  - 🇨🇳 台湾节点
  - 🇸🇬 狮城节点
  - 🇯🇵 日本节点
  - 🇺🇲 美国节点
  - 🇬🇧 英国节点
  - 🌐 其他地区节点
  - DIRECT
- name: 手动选择
  type: select
  choices: []
  filter: .*
- name: 自动选择
  type: url-test
  filter: .*
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
- name: Google
  type: select
  filter: .*
  template: service
- name: OpenAI
  type: select
  template: service
- name: Adobe
  type: select
